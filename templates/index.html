<!DOCTYPE html>
<html>

<head>
    <title>Smart Traffic Accident Alert</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px #aaa;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 12px 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #eee;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🚗 Smart Traffic Accident Alert</h1>

        <form action="/predict" method="POST">

            <input type="number" name="speed" step="any" placeholder="Vehicle Speed (km/h)" required>

            <input type="number" name="acceleration" step="any" placeholder="Acceleration (m/s²)" required>

            <input type="number" name="impact" step="any" placeholder="Impact Level (0-10)" required>

            <input type="number" name="tilt" step="any" placeholder="Vehicle Tilt (degrees)" required>

            <br>

            <button type="submit">Predict Accident Risk</button>

        </form>

        {% if result %}

        <div class="result">

            <h2>{{ result }}</h2>

            <h3>📊 Accident Risk: {{ risk }}%</h3>

            <p>{{ message }}</p>

            <hr>

            <p>Speed: {{ speed }} km/h</p>
            <p>Acceleration: {{ acceleration }} m/s²</p>
            <p>Impact Level: {{ impact }}</p>
            <p>Vehicle Tilt: {{ tilt }}°</p>

        </div>

        {% endif %}

    </div>

</body>

</html>
